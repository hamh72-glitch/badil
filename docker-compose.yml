services:
  db:
    image: mysql:8.0
    container_name: badil_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-badil}
      MYSQL_USER: ${DB_USER:-badil}
      MYSQL_PASSWORD: ${DB_PASS:-badil}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    container_name: badil_web
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-badil}
      DB_USER: ${DB_USER:-badil}
      DB_PASS: ${DB_PASS:-badil}
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
